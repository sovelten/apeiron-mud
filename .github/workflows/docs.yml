# Regenerate the Apeiron HTML documentation and publish it to GitHub Pages.
#
# Uses plain SBCL + Quicklisp — the same environment as the local
# `sbcl --load run-docs.lisp` workflow — instead of the Roswell-based
# 40ants/setup-lisp action (which requires a LISP env var, a qlfile and
# Qlot, i.e. a different environment than development).
#
# After the first run, enable Pages in the repo settings with
# "Deploy from a branch" -> "GitHub Actions" as the source.

name: Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install Quicklisp
        run: |
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -sL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
            sbcl --non-interactive --load /tmp/quicklisp.lisp --eval '(quicklisp-quickstart:install)'
          fi

      - name: Generate documentation
        run: sbcl --non-interactive --load run-docs.lisp

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
