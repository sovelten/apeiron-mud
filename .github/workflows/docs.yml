# Regenerate the Apeiron HTML documentation and publish it to GitHub Pages,
# using the maintained 40ants actions (same ones 40ants libraries use).
#
#  1. 40ants/setup-lisp installs Roswell + SBCL + Qlot, installs the qlfile
#     dependencies, and loads the apeiron-docs system.
#  2. 40ants/build-docs runs the docs-builder: it renders the HTML manual
#     into docs/build/, regenerates README.md from the @readme section,
#     uploads the site to the gh-pages branch, and pushes README changes
#     back to the current branch.
#
# One-time setup: Settings -> Pages -> Source -> "Deploy from a branch"
# -> gh-pages.

name: Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Common Lisp Environment
        uses: 40ants/setup-lisp@v4
        with:
          asdf-system: apeiron-docs

      - name: Build Docs
        uses: 40ants/build-docs@v1
        with:
          asdf-system: apeiron-docs
          error-on-warnings: false
