name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: apeiron

      - uses: 40ants/run-tests@v2
        with:
          asdf-system: apeiron
